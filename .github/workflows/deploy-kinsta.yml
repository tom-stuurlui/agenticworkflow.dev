name: Deploy theme to Kinsta

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH Connection
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.KINSTA_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.KINSTA_PORT }} -H ${{ secrets.KINSTA_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy Theme using Native Rsync
        run: |
          rsync -avz --delete \
            -e "ssh -p ${{ secrets.KINSTA_PORT }}" \
            --exclude='.git*' \
            --exclude='node_modules/' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            ./ ${{ secrets.KINSTA_USER }}@${{ secrets.KINSTA_HOST }}:${{ secrets.KINSTA_PATH }}
